apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing
  labels: { app: oficina-billing, tags.datadoghq.com/service: oficina-billing-service, tags.datadoghq.com/env: {{ .Values.config.DD_ENV | quote }}, tags.datadoghq.com/version: {{ .Values.config.DD_VERSION | quote }} }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: oficina-billing }
  template:
    metadata:
      labels: { app: oficina-billing, tags.datadoghq.com/service: oficina-billing-service, tags.datadoghq.com/env: {{ .Values.config.DD_ENV | quote }}, tags.datadoghq.com/version: {{ .Values.config.DD_VERSION | quote }} }
      annotations:
        ad.datadoghq.com/billing.logs: '[{"source":"nodejs","service":"oficina-billing-service"}]'
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: billing
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 3001, name: http }]
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          env:
            - name: PORT
              value: "3001"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef: { fieldPath: status.hostIP }
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/live, port: http }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: oficina-billing
spec:
  type: {{ .Values.service.type }}
  selector: { app: oficina-billing }
  ports: [{ name: http, port: 3001, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oficina-billing
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: oficina-billing }
