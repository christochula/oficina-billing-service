services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina_billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d oficina_billing"]
      interval: 5s
      retries: 10
  billing:
    build: .
    ports: ["3001:3001"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://billing:billing@db:5432/oficina_billing
    depends_on:
      db:
        condition: service_healthy
